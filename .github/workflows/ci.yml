name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - "release/**"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project apps/api --group dev
      - working-directory: apps/api
        run: uv run ruff check .
      - working-directory: apps/api
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build

  android-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android skeleton exists
        run: |
          test -f apps/android/settings.gradle.kts
          test -f apps/android/app/build.gradle.kts
          test -f apps/android/app/src/main/AndroidManifest.xml
          test -f apps/android/app/src/main/java/com/example/commerce/MainActivity.kt
