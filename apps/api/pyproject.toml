[project]
name = "commerce-api"
version = "0.1.0"
description = "FastAPI backend for the e-commerce platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi[standard]>=0.115,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlmodel>=0.0.22,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
